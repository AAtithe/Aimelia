[project]
name = "aimelia-api"
version = "0.1.0"
description = "Aimelia – Microsoft-first AI PA API"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "python-dotenv",
  "sqlalchemy>=2",
  "psycopg2-binary",
  "apscheduler",
  "httpx",
  "itsdangerous",
  "cryptography",
  "openai>=1.0.0",
  "anthropic>=0.40.0",
]

[tool.uvicorn]
factory = false
host = "0.0.0.0"
port = 8000